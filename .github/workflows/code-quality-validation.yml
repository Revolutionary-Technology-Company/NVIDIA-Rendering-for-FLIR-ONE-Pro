name: UWMed FLIR Pipeline Code Quality & Validation

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - name: Checkout Repository Codebase
      uses: actions/checkout@v4

    - name: Initialize Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Libraries (Stub Bindings)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev pkg-config

    - name: Ingest Python Dependency Modules
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        # Install headless opencv variant specifically for virtualized test runners
        pip install opencv-python-headless numpy numba streamlit
        # Mock install pyusb for standard runner validation tests
        pip install pyusb

    - name: Execute Flake8 Linting & Syntax Audit
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Execute Pipeline Unit Tests
      run: |
        # Explicitly mock CUDA-simulator behavior for Numba since standard runners lack NVIDIA hardware
        export NUMBA_ENABLE_CUDASIM=1
        python -m unittest discover -s tests -p "test_*.py"
